name: "Copilot Setup Steps"
description: "Setup steps for the GitHub Copilot cloud agent environment"

steps:
  - name: Install pnpm
    uses: pnpm/action-setup@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '22'

  - name: Install dependencies
    run: pnpm install
